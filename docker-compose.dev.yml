# Développement : uniquement PostgreSQL et Redis (Django et Next.js tournent en local).
# docker compose -f docker-compose.dev.yml up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: proxicredit
      POSTGRES_USER: proxicredit
      POSTGRES_PASSWORD: proxicredit
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata_dev:
