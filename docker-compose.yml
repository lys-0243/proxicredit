# Production (VPS) : docker compose up -d --build
# Variables obligatoires dans .env à la racine : voir .env.example
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-proxicredit}
      POSTGRES_USER: ${POSTGRES_USER:-proxicredit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?mot de passe PostgreSQL requis}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-proxicredit}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-proxicredit}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-proxicredit}
      REDIS_URL: redis://redis:6379/0
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py initialiser &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-proxicredit}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-proxicredit}
      REDIS_URL: redis://redis:6379/0
    command: celery -A config worker -l info
    depends_on: [backend]

  beat:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-proxicredit}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-proxicredit}
      REDIS_URL: redis://redis:6379/0
    command: celery -A config beat -l info
    depends_on: [backend]

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    depends_on: [backend]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/proxicredit.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [frontend, backend]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-proxicredit}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-proxicredit}
    volumes:
      - ./backups:/backups
      - media:/media:ro
    # Sauvegarde quotidienne de la base et des fichiers (photos, KYC), conservation 30 jours.
    # À copier ensuite hors site (chiffrée).
    entrypoint: >
      sh -c "while true; do
               pg_dump -Fc > /backups/proxicredit-$$(date +%F).dump &&
               tar czf /backups/media-$$(date +%F).tar.gz -C /media . &&
               find /backups -name '*.dump' -mtime +30 -delete &&
               find /backups -name 'media-*.tar.gz' -mtime +30 -delete;
               sleep 86400;
             done"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
