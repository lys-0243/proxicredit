name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: proxicredit
          POSTGRES_USER: proxicredit
          POSTGRES_PASSWORD: proxicredit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U proxicredit" --health-interval 5s --health-retries 10
    env:
      # Les tests tournent sur PostgreSQL : les triggers d'immuabilité y sont vérifiés.
      DATABASE_URL: postgres://proxicredit:proxicredit@localhost:5432/proxicredit
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - run: ruff check . && ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
