# Le HTTPS (certificat Let's Encrypt) se termine idéalement ici ou sur un proxy en amont
# (voir deploy/caddy et docker-compose.staging.yml).

# Derrière un proxy HTTPS, on transmet le protocole qu'il annonce ; sinon, celui de la connexion.
map $http_x_forwarded_proto $proxy_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy same-origin;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_proto;
    }

    location ~ ^/(admin|static)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_proto;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_proto;
    }
}
